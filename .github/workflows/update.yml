# Update this copy of Listening Notes.
#
# Once an hour, on its own, this checks for a newer Listening Notes and, if
# there is one, brings it in, pushes it to your branch, and Vercel builds it
# from there — your database is brought up to date by the build itself.
# Nothing to install, nothing to press. The one thing it will not do on its
# own is cross a major version (1.x to 2.0), because that is the kind of
# update that asks something of you: for those, and whenever you would
# rather not wait, press "Run workflow" on the Actions tab.
#
# GitHub switches the hourly check off in a repository that has had no
# commits for two months, and emails you; pressing Run workflow once turns
# it back on.
#
# Nothing here reports anywhere: it fetches the public code the way a
# browser would and pushes to the repository it runs in, with the token
# GitHub gives every workflow. The work itself lives upstream in
# scripts/update_copy.mjs, fetched fresh each run, so this file never needs
# to change — which matters, because a workflow cannot rewrite itself.
name: Update this copy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bring in the latest Listening Notes
        run: |
          git fetch --no-tags https://github.com/ListeningNotes/listening-notes.git '+main:refs/remotes/upstream/main'
          git show upstream/main:scripts/update_copy.mjs > "$RUNNER_TEMP/update_copy.mjs"
          node "$RUNNER_TEMP/update_copy.mjs"
